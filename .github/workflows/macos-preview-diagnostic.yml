name: Diagnose macOS preview artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Preview workflow run containing the Mac artifacts
        required: true
        default: '36390899664'
        type: string

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tabby-macos-${{ matrix.arch }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify app after installing from the downloaded DMG
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 3 -type f -print
          dmg="$(find . -maxdepth 3 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          hdiutil verify "$dmg"
          mount_dir="$(mktemp -d)"
          copy_dir="$(mktemp -d)"
          trap 'hdiutil detach "$mount_dir" || true; rm -rf "$mount_dir" "$copy_dir"' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg"
          codesign --verify --deep --strict --verbose=2 "$mount_dir/Tabby.app"
          ditto "$mount_dir/Tabby.app" "$copy_dir/Tabby.app"
          codesign --verify --deep --strict --verbose=2 "$copy_dir/Tabby.app"
          codesign -dv --verbose=2 "$copy_dir/Tabby.app" 2>&1 | grep 'Signature=adhoc'
          if spctl --assess --type execute --verbose=4 "$copy_dir/Tabby.app"; then
            echo 'Gatekeeper accepted the ad-hoc preview unexpectedly'
          else
            echo 'Gatekeeper rejected the ad-hoc preview, as expected without Developer ID signing'
          fi
